name: Review Status Labels

# Mirror GitHub's native "Approved" vs "Review required" status as PR labels.
# Trigger ONLY on review submit/dismiss — NOT on `synchronize` (commit pushes),
# so new commits after an approval do not flip the label, matching GitHub's
# Approved-vs-Review-required behavior.
on:
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  pull-requests: write

jobs:
  label-review-status:
    runs-on: ubuntu-latest
    steps:
      - name: Apply review-status label
        uses: actions/github-script@v7
        with:
          script: |
            const APPROVED = 'approved';
            const NEEDS_REVIEW = 'needs-review';

            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            // Fetch ALL reviews (paginated) so PRs with many reviews work.
            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner, repo, pull_number: prNumber, per_page: 100 }
            );

            // Reduce to the latest review state per reviewer.
            // Ignore COMMENTED reviews — they don't change approval status.
            const latestByReviewer = new Map();
            for (const review of reviews) {
              if (review.state === 'COMMENTED') continue;
              const login = review.user && review.user.login;
              if (!login) continue;
              // Reviews come back in chronological order, so later wins.
              latestByReviewer.set(login, review.state);
            }

            const states = [...latestByReviewer.values()];
            const hasApproved = states.includes('APPROVED');
            const hasChangesRequested = states.includes('CHANGES_REQUESTED');

            // Approved iff at least one APPROVED and no outstanding CHANGES_REQUESTED.
            const labelToAdd = (hasApproved && !hasChangesRequested) ? APPROVED : NEEDS_REVIEW;
            const labelToRemove = labelToAdd === APPROVED ? NEEDS_REVIEW : APPROVED;

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: prNumber,
              labels: [labelToAdd],
            });

            // Remove the opposite label, tolerating a 404 if it isn't present.
            try {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: prNumber,
                name: labelToRemove,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
